<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">🔐 Enterprise Network Architecture — pfSense Security Lab</text>

  <!-- ══════════════ INTERNET CLOUD ══════════════ -->
  <ellipse cx="450" cy="90" rx="100" ry="30" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="86" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">INTERNET / WAN</text>
  <text x="450" y="100" text-anchor="middle" fill="#64748b" font-size="9">192.168.1.0/24</text>

  <!-- Arrow Internet → Router -->
  <line x1="450" y1="120" x2="450" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══════════════ KALI LINUX (Attacker) ══════════════ -->
  <rect x="60" y="62" width="130" height="56" rx="8" fill="#1a0a0a" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="82" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">⚔ Kali Linux</text>
  <text x="125" y="96" text-anchor="middle" fill="#94a3b8" font-size="9">Attacker Node</text>
  <text x="125" y="109" text-anchor="middle" fill="#64748b" font-size="9">192.168.1.100</text>
  <!-- Kali → Internet -->
  <line x1="190" y1="90" x2="350" y2="90" stroke="#ef444455" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ══════════════ EDGE ROUTER ══════════════ -->
  <rect x="370" y="150" width="160" height="60" rx="8" fill="#0c1a2e" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="170" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="bold">🔀 Edge Router (RE)</text>
  <text x="450" y="184" text-anchor="middle" fill="#94a3b8" font-size="9">fa0/0: DHCP  |  fa0/1: 10.0.0.1/30</text>
  <text x="450" y="198" text-anchor="middle" fill="#64748b" font-size="9">Cisco IOS</text>

  <!-- Arrow Router → pfSense -->
  <line x1="450" y1="210" x2="450" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="232" fill="#64748b" font-size="8">10.0.0.0/30</text>

  <!-- ══════════════ PFSENSE FIREWALL ══════════════ -->
  <rect x="270" y="250" width="360" height="110" rx="10" fill="#0d1f0d" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="272" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">🔥 pfSense Firewall 2.7.2</text>
  <line x1="290" y1="278" x2="610" y2="278" stroke="#22c55e" stroke-width="0.5" opacity="0.4"/>
  <text x="320" y="294" fill="#86efac" font-size="9">✦ Suricata IDS/IPS (WAN)</text>
  <text x="320" y="308" fill="#86efac" font-size="9">✦ OpenVPN Server — Aegis-VPN-Server :1194</text>
  <text x="320" y="322" fill="#86efac" font-size="9">✦ NAT Port Forward  (HTTP:80 → DMZ, FTP:21 → DMZ)</text>
  <text x="320" y="336" fill="#86efac" font-size="9">✦ Strict Firewall Rules  |  Hybrid Outbound NAT</text>
  <text x="320" y="350" fill="#64748b" font-size="8">WAN: 10.0.0.2  |  LAN: 10.0.1.1  |  DMZ: 10.0.2.1  |  MGMT: 10.0.3.1</text>

  <!-- ══════════════ 3 BRANCH LINES ══════════════ -->
  <!-- horizontal bar -->
  <line x1="180" y1="400" x2="720" y2="400" stroke="#475569" stroke-width="1.5"/>
  <!-- vertical from firewall -->
  <line x1="450" y1="360" x2="450" y2="400" stroke="#475569" stroke-width="1.5"/>
  <!-- verticals to zones -->
  <line x1="180" y1="400" x2="180" y2="430" stroke="#475569" stroke-width="1.5"/>
  <line x1="450" y1="400" x2="450" y2="430" stroke="#475569" stroke-width="1.5"/>
  <line x1="720" y1="400" x2="720" y2="430" stroke="#475569" stroke-width="1.5"/>

  <!-- ══════════════ LAN ZONE ══════════════ -->
  <rect x="60" y="430" width="240" height="160" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="430" width="240" height="26" rx="10" fill="#2d1b4e"/>
  <text x="180" y="447" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">🖥 LAN Zone — 10.0.1.0/24</text>
  <!-- nodes -->
  <rect x="75" y="463" width="100" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="125" y="478" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="bold">💻 PC Windows</text>
  <text x="125" y="491" text-anchor="middle" fill="#64748b" font-size="8">10.0.1.10</text>

  <rect x="185" y="463" width="100" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="235" y="478" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="bold">🐧 Ubuntu</text>
  <text x="235" y="491" text-anchor="middle" fill="#64748b" font-size="8">10.0.1.20</text>

  <rect x="75" y="508" width="100" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="125" y="523" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="bold">⚔ Kali (intern)</text>
  <text x="125" y="536" text-anchor="middle" fill="#64748b" font-size="8">10.0.1.30</text>

  <rect x="185" y="508" width="100" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="235" y="523" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="bold">📡 SW (VLAN10)</text>
  <text x="235" y="536" text-anchor="middle" fill="#64748b" font-size="8">Layer 2</text>

  <text x="180" y="576" text-anchor="middle" fill="#7c3aed" font-size="8">pfSense: 10.0.1.1/24</text>

  <!-- ══════════════ DMZ ZONE ══════════════ -->
  <rect x="330" y="430" width="240" height="160" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="330" y="430" width="240" height="26" rx="10" fill="#3d2000"/>
  <text x="450" y="447" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">🌐 DMZ Zone — 10.0.2.0/24</text>

  <rect x="345" y="463" width="100" height="36" rx="6" fill="#292008" stroke="#f59e0b" stroke-width="1"/>
  <text x="395" y="478" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold">🌍 Web Server</text>
  <text x="395" y="491" text-anchor="middle" fill="#64748b" font-size="8">Apache :80 → 10.0.2.10</text>

  <rect x="455" y="463" width="100" height="36" rx="6" fill="#292008" stroke="#f59e0b" stroke-width="1"/>
  <text x="505" y="478" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold">📁 FTP Server</text>
  <text x="505" y="491" text-anchor="middle" fill="#64748b" font-size="8">vsFTPd :21 → 10.0.2.20</text>

  <rect x="345" y="508" width="100" height="36" rx="6" fill="#292008" stroke="#f59e0b" stroke-width="1"/>
  <text x="395" y="523" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold">📧 Mail Server</text>
  <text x="395" y="536" text-anchor="middle" fill="#64748b" font-size="8">Postfix → 10.0.2.12</text>

  <rect x="455" y="508" width="100" height="36" rx="6" fill="#292008" stroke="#f59e0b" stroke-width="1"/>
  <text x="505" y="523" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold">📡 SW (VLAN30)</text>
  <text x="505" y="536" text-anchor="middle" fill="#64748b" font-size="8">Layer 2</text>

  <text x="450" y="576" text-anchor="middle" fill="#b45309" font-size="8">pfSense: 10.0.2.1/24  |  NAT Port Forward</text>

  <!-- ══════════════ MGMT ZONE ══════════════ -->
  <rect x="600" y="430" width="240" height="160" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="600" y="430" width="240" height="26" rx="10" fill="#0a2530"/>
  <text x="720" y="447" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">🛡 MGMT Zone — 10.0.3.0/24</text>

  <rect x="615" y="463" width="100" height="36" rx="6" fill="#072030" stroke="#06b6d4" stroke-width="1"/>
  <text x="665" y="478" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="bold">📊 Wazuh SIEM</text>
  <text x="665" y="491" text-anchor="middle" fill="#64748b" font-size="8">10.0.3.10 :443</text>

  <rect x="725" y="463" width="100" height="36" rx="6" fill="#072030" stroke="#06b6d4" stroke-width="1"/>
  <text x="775" y="478" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="bold">🔑 Admin VPN</text>
  <text x="775" y="491" text-anchor="middle" fill="#64748b" font-size="8">OpenVPN 10.0.8.x</text>

  <rect x="615" y="508" width="210" height="36" rx="6" fill="#072030" stroke="#06b6d4" stroke-width="1"/>
  <text x="720" y="523" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="bold">📡 SW-MGMT (VLAN30)</text>
  <text x="720" y="536" text-anchor="middle" fill="#64748b" font-size="8">pfSense admin: 10.0.3.1  |  DNS: 53</text>

  <text x="720" y="576" text-anchor="middle" fill="#0e7490" font-size="8">pfSense: 10.0.3.1/24  |  Wazuh + OpenVPN</text>

  <!-- ══════════════ LEGEND ══════════════ -->
  <text x="20" y="610" fill="#334155" font-size="8">🔴 Attacker  🟢 Firewall  🟣 LAN  🟡 DMZ  🔵 MGMT</text>
  <text x="700" y="610" fill="#334155" font-size="8">pfSense Security Lab — GNS3 + VirtualBox</text>
</svg>
